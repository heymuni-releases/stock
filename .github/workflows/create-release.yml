name: Create Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string
        default: "v0.1.0.61"
      title:
        description: "Release title"
        required: true
        type: string
        default: "StockAuto v0.1.0.61"
      notes:
        description: "Release notes"
        required: true
        type: string
        default: "StockAuto 최신 빌드"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Bot Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          echo "$NOTES" > /tmp/notes.md
          gh release create "$TAG" --title "$TITLE" --notes-file /tmp/notes.md
