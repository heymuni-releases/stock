name: Create Bot Draft Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string
        default: "v0.1.0.61"
      title:
        description: "Release title"
        required: true
        type: string
        default: "StockAuto v0.1.0.61"
      notes:
        description: "Release notes"
        required: true
        type: string
        default: "StockAuto 최신 빌드"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Bot Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          pages = json.loads(subprocess.check_output([
              "gh", "api", "--paginate", "--slurp",
              f"repos/{os.environ['GITHUB_REPOSITORY']}/releases?per_page=100",
          ], text=True))
          existing = next((r for page in pages for r in page if r["tag_name"] == os.environ["TAG"]), None)
          if existing is not None:
              if not existing["draft"] or existing["author"]["login"] != "github-actions[bot]":
                  raise SystemExit("Refusing to overwrite a published or non-bot release")
              raise SystemExit(0)
          with tempfile.NamedTemporaryFile(mode="w", encoding="utf-8") as notes:
              notes.write(os.environ["NOTES"])
              notes.flush()
              subprocess.run([
                  "gh", "release", "create", os.environ["TAG"], "--draft",
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--title", os.environ["TITLE"], "--notes-file", notes.name,
              ], check=True)
          PY
