name: Re-publish releases as bot

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable tag, or all"
        required: true
        type: string
      apply:
        description: "Recreate releases after verifying every original asset"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-maintenance
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and re-publish releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=(--tag "$RELEASE_TAG")
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          python3 .github/scripts/republish-as-bot.py "${args[@]}"
