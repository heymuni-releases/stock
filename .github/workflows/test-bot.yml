name: Bot Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Release Creation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v-test-bot --title "Test Bot" --notes "Test"
          gh release view v-test-bot --json author
          gh release delete v-test-bot --yes
