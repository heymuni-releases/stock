name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v0.1.0.63"
      source_ref:
        description: "Private source commit or branch"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOURCE_ACCOUNT: ${{ secrets.SOURCE_ACCOUNT }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.SOURCE_ACCESS_TOKEN }}
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Stamp build version
        shell: pwsh
        run: |
          $ver = "${{ inputs.tag }}".TrimStart('v')
          (Get-Content src/stock_auto/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$ver`"" | Set-Content src/stock_auto/__init__.py
          Get-Content src/stock_auto/__init__.py

      - name: Build and smoke-test portable app
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Secure

      - name: Retain update verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/update-verification/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows asset to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}"
          $zipPath = "dist/StockAuto-windows-x64.zip"
          $zip = Get-Item $zipPath
          $sha = (Get-FileHash -Path $zip.FullName -Algorithm SHA256).Hash.ToLower()
          $size = $zip.Length
          Write-Host "Built Windows Zip: $size bytes, SHA256: $sha"

          # Upload with clobber
          gh release upload "$tag" "$zipPath" --repo heymuni-releases/stock --clobber

          # Download and update release-manifest.json
          gh release download "$tag" -p "release-manifest.json" --repo heymuni-releases/stock --clobber
          $manifest = Get-Content "release-manifest.json" | ConvertFrom-Json
          if (-not $manifest.assets) {
              $manifest | Add-Member -MemberType NoteProperty -Name "assets" -Value ([PSCustomObject]@{})
          }
          $winObj = [PSCustomObject]@{
              name = "StockAuto-windows-x64.zip"
              sha256 = $sha
              size = $size
          }
          $manifest.assets | Add-Member -MemberType NoteProperty -Name "windows-x64" -Value $winObj -Force
          $manifestJson = $manifest | ConvertTo-Json -Depth 5
          Set-Content -Path "release-manifest.json" -Value $manifestJson
          gh release upload "$tag" "release-manifest.json" --repo heymuni-releases/stock --clobber
          Write-Host "Updated release manifest for $tag successfully"
